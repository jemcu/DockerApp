<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestor de tareas</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f3f6fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 20px; }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px;
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 36px #17255414;
      }
      h1 { margin: 0 0 8px; color: #123b6d; }
      .intro { margin: 0 0 24px; color: #64748b; }
      form { display: grid; gap: 12px; }
      input, textarea, button {
        font: inherit;
        border-radius: 8px;
        padding: 11px 12px;
      }
      input, textarea { width: 100%; border: 1px solid #cbd5e1; }
      textarea { min-height: 84px; resize: vertical; }
      button { border: 0; cursor: pointer; }
      .submit { color: white; background: #1769aa; font-weight: 650; }
      .submit:hover { background: #12568e; }
      #mensaje { min-height: 24px; margin: 14px 0; color: #b42318; }
      ul { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
      li {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
      }
      li input { width: auto; margin-top: 5px; }
      .contenido { flex: 1; min-width: 0; }
      .contenido strong { display: block; overflow-wrap: anywhere; }
      .contenido p { margin: 5px 0 0; color: #64748b; white-space: pre-wrap; }
      li.completada strong { color: #64748b; text-decoration: line-through; }
      .eliminar { color: #b42318; background: #fff1f0; }
      @media (max-width: 520px) {
        body { padding: 20px 12px; }
        main { padding: 22px 16px; }
        li { padding: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gestor de tareas</h1>
      <p class="intro">Organiza tus tareas y marca las que ya terminaste.</p>
      <form id="form-tarea">
        <label>
          Título
          <input id="titulo" name="titulo" maxlength="255" required>
        </label>
        <label>
          Descripción (opcional)
          <textarea id="descripcion" name="descripcion"></textarea>
        </label>
        <button class="submit" type="submit">Agregar tarea</button>
      </form>
      <p id="mensaje" role="status" aria-live="polite"></p>
      <ul id="tareas" aria-label="Lista de tareas"></ul>
    </main>
    <script>
      const lista = document.querySelector("#tareas");
      const mensaje = document.querySelector("#mensaje");

      async function solicitar(url, opciones = {}) {
        const respuesta = await fetch(url, {
          ...opciones,
          headers: { "Content-Type": "application/json", ...opciones.headers },
        });
        const datos = await respuesta.json();
        if (!respuesta.ok) throw new Error(datos.error || "Ocurrió un error.");
        return datos;
      }

      async function cargarTareas() {
        try {
          const tareas = await solicitar("/api/tareas");
          lista.replaceChildren();
          for (const tarea of tareas) {
            const elemento = document.createElement("li");
            elemento.classList.toggle("completada", tarea.completada);

            const casilla = document.createElement("input");
            casilla.type = "checkbox";
            casilla.checked = tarea.completada;
            casilla.setAttribute("aria-label", `Marcar ${tarea.titulo} como completada`);
            casilla.addEventListener("change", async () => {
              try {
                await solicitar(`/api/tareas/${tarea.id}`, {
                  method: "PATCH",
                  body: JSON.stringify({ completada: casilla.checked }),
                });
                await cargarTareas();
              } catch (error) {
                mensaje.textContent = error.message;
              }
            });

            const contenido = document.createElement("div");
            contenido.className = "contenido";
            const titulo = document.createElement("strong");
            titulo.textContent = tarea.titulo;
            contenido.append(titulo);
            if (tarea.descripcion) {
              const descripcion = document.createElement("p");
              descripcion.textContent = tarea.descripcion;
              contenido.append(descripcion);
            }

            const eliminar = document.createElement("button");
            eliminar.className = "eliminar";
            eliminar.type = "button";
            eliminar.textContent = "Eliminar";
            eliminar.setAttribute("aria-label", `Eliminar ${tarea.titulo}`);
            eliminar.addEventListener("click", async () => {
              try {
                await solicitar(`/api/tareas/${tarea.id}`, { method: "DELETE" });
                await cargarTareas();
              } catch (error) {
                mensaje.textContent = error.message;
              }
            });

            elemento.append(casilla, contenido, eliminar);
            lista.append(elemento);
          }
          mensaje.textContent = "";
        } catch (error) {
          mensaje.textContent = error.message;
        }
      }

      document.querySelector("#form-tarea").addEventListener("submit", async (evento) => {
        evento.preventDefault();
        const elementoFormulario = evento.currentTarget;
        const formulario = new FormData(elementoFormulario);
        try {
          await solicitar("/api/tareas", {
            method: "POST",
            body: JSON.stringify({
              titulo: formulario.get("titulo"),
              descripcion: formulario.get("descripcion"),
            }),
          });
          elementoFormulario.reset();
          await cargarTareas();
        } catch (error) {
          mensaje.textContent = error.message;
        }
      });

      cargarTareas();
    </script>
  </body>
</html>
